<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            border: 10px solid rgb(0, 0, 169);
            border-radius: 15px;
            width: 400px;
            margin-left: 35%;
            margin-top: 50px;
        }
        img {
            width: 100%;
            border-radius: 5px;
            position: relative;
            z-index: -1;
        }
        h1 {
            margin-top: -190px;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,1);
        }

        #closeBtn {
            position: absolute;
            margin-top: 5px;
            margin-left: -395px;
        }

        #myForm {
            background-color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 20px;
            padding: 0 20px;
            border-radius: 0 0 5px 5px;
        }
        h3 {
            grid-column: 1/3;
            text-align: center;
            margin-top: 15px;
        }
        section {
            grid-column: 1/3;
            justify-self: center;
        }

        #scriptures {
            display: flex;
            gap: 5px;
            grid-column: 1/3;
            margin-bottom: 10px;
        }
        #scriptures img{
            z-index: 1;
            border-radius: 0;
            width: 100%;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <img src="images/jesus_feeds_5000.jpeg">
        <button type="button" id="closeBtn">X</button>
        <h1>Daily Feed</h1>
        <h2>Scripture a Day</h2>
        <form id="myForm">
            <h3>Sign Up for Daily Scripture Feed</h3>
            
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
            <div id="scriptures">
                <img src="images/old_testament.webp">
                <img src="images/new_testament.webp">
                <img src="images/book_of_mormon.webp">
                <img src="images/doctrine_and_covenants.webp">
                <img src="images/pearl_of_great_price.webp">
            </div>
        </form>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
