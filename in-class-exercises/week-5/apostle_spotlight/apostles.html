<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background-color: #E8ECED;
            font-family: Arial;
            color: white;
        }
        #card {
            background-image: url(images/christus.webp);
            width: 1000px;
            border: 5px solid black;
            border-radius: 30px;
            margin-left: auto;
            margin-right: auto;
        }
        h1, h2 {
            text-align: center;
        }
        img {
            border-radius: 100%;
            border: 5px solid white;
        }
        .first-presidency {
            display: flex;
            justify-content: center;
        }
        .first-presidency img {
            width: 200px;
            margin: 25px;
        }
        #twelve {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            justify-items: center;
            align-content: space-around;
            margin-left: 40px;
            margin-right: 40px;
        }
        #twelve img {
            width: 150px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="card">
        <h1>First Presidency</h1>
        <div class="first-presidency">
            <img src="images/eyring.webp">
            <img id="prophet" src="images/oaks.webp">
            <img src="images/christofferson.webp">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div id="twelve">
            <img src="images/uchtdorf.webp">
            <img src="images/bednar.webp">
            <img src="images/cook.webp">
            <img src="images/anderson.webp">
            <img src="images/rasband.webp">
            <img src="images/stevenson.webp">
            <img src="images/renlund.webp">
            <img src="images/gong.webp">
            <img src="images/soares.webp">
            <img src="images/kearon.webp">
            <img src="images/causse.webp">
            <img src="images/gilbert.webp">
        </div>
    </div>
</body>
</html>
