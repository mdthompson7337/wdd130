<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr class="table-header">
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder David A. Bednar</td>
            <td>Things as They Really Are 2.0</td>
            <td>BYU-Idaho</td>
            <td>2025</td>
          </tr>
          <tr>
            <td>Chris Allison</td>
            <td>Revelation: Opening the Heavens</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle is the Lord's</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
        </table>

        <form>
          <label for="speaker-name">Speaker: </label>
          <input type="text" id="speaker-name" required>

          <label for="title">Title: </label>
          <input type="text" id="title">

          <label for="location">Location: </label>
          <input type="text" id="location">

          <label for="year">Year: </label>
          <input type="password" id="year">

          <input id="submit-button" type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
